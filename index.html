<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фінанси">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Менеджер фінансів</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="statusbar-bg"></div>
<main id="view"></main>

<nav id="tabbar">
  <button data-act="tab" data-tab="tx">
    <svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span>Транзакції</span>
  </button>
  <button data-act="tab" data-tab="charts">
    <svg class="i" viewBox="0 0 24 24"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
    <span>Діаграми</span>
  </button>
  <button class="plus" data-act="add" aria-label="Додати операцію">
    <span><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px;stroke-width:2.5"><path d="M12 5v14M5 12h14"/></svg></span>
  </button>
  <button data-act="tab" data-tab="accounts">
    <svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 11h20M16 15.5h2M5 6l11-3 1.5 3"/></svg>
    <span>Рахунки</span>
  </button>
  <button data-act="tab" data-tab="invest">
    <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
    <span>Накопичення</span>
  </button>
</nav>

<div id="sheet-root"></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
